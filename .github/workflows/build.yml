name: Build OrangeFox Recovery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Build Environment
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip

      - name: Initialize Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH

      - name: Sync OrangeFox Source
        run: |
          mkdir -p ~/orangefox
          cd ~/orangefox
          repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Set Up Device Tree
        run: |
          mkdir -p ~/orangefox/device/tecno/TECNO-CC7
          cp -r device/tecno/TECNO-CC7/* ~/orangefox/device/tecno/TECNO-CC7/
          cp boot.img ~/orangefox/device/tecno/TECNO-CC7/prebuilt/kernel
          cp -r vendor ~/orangefox/device/tecno/TECNO-CC7/proprietary/

      - name: Build Recovery
        run: |
          cd ~/orangefox
          source build/envsetup.sh
          lunch omni_TECNO-CC7-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v3
        with:
          name: recovery.img
          path: ~/orangefox/out/target/product/TECNO-CC7/recovery.img
